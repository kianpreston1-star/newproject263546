[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Trend-following trading bot for BNB Chain (PancakeSwap) with backtesting and risk controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "web3>=7,<8",
    "numpy>=1.24",
    "pandas>=2.2",
    "requests>=2.28",
    "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools]
packages = ["tradebot"]

[tool.setuptools.package-data]
tradebot = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
